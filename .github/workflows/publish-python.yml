name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published immutable release tag on main, for example v1.2.0-rc.2
        required: true
        type: string
      qualified-run-id:
        description: Optional completed publication run whose seven qualification jobs passed before assembly failed
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pypi-paacs-mesh
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'PAACS-Software/paacs-mesh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      artifact-run-id: ${{ steps.source.outputs.artifact-run-id }}
      reuse-qualified: ${{ steps.source.outputs.reuse-qualified }}
      builder-artifact-ids: ${{ steps.source.outputs.builder-artifact-ids }}
      consumer-artifact-ids: ${{ steps.source.outputs.consumer-artifact-ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0
      - name: Verify release source and any previous qualification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          WORKFLOW_SHA: ${{ github.sha }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified-run-id }}
        run: python scripts/check_python_release_run.py --tag "$RELEASE_TAG" --workflow-sha "$WORKFLOW_SHA" --qualified-run-id "$QUALIFIED_RUN_ID"

  qualify:
    needs: prepare
    if: needs.prepare.outputs.reuse-qualified != 'true'
    uses: ./.github/workflows/python-wheel.yml
    with:
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  assemble:
    needs: [prepare, qualify]
    if: always() && needs.prepare.result == 'success' && (needs.qualify.result == 'success' || (needs.prepare.outputs.reuse-qualified == 'true' && needs.qualify.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          path: build/release-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0 twine==6.2.0
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact-run-id }}
          artifact-ids: ${{ needs.prepare.outputs.builder-artifact-ids }}
          pattern: paacs-mesh-cp312-*
          path: release-builders
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact-run-id }}
          artifact-ids: ${{ needs.prepare.outputs.consumer-artifact-ids }}
          pattern: paacs-mesh-installed-*
          path: release-consumers
      - name: Verify all builders and clean consumers from the same source
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          python scripts/prepare_python_release.py assemble --source build/release-source --builders release-builders --consumers release-consumers --expected-sha "$EXPECTED_SHA" --output build/python-release
          python -m twine check --strict build/python-release/dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-pypi-wheels
          path: build/python-release/dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-release-manifest
          path: build/python-release/release-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-release-assets
          path: build/python-release/release-assets/*
          if-no-files-found: error

  source-release:
    needs: [prepare, assemble]
    if: always() && needs.prepare.result == 'success' && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0
      - uses: actions/download-artifact@v6
        with:
          name: paacs-mesh-release-assets
          path: release-assets
      - name: Attach matching source and qualification receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: python scripts/prepare_python_release.py source-assets --tag "$RELEASE_TAG" --dist release-assets --expected-sha "$EXPECTED_SHA"

  publish:
    needs: [prepare, assemble, source-release]
    if: always() && needs.prepare.result == 'success' && needs.assemble.result == 'success' && needs.source-release.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/paacs-mesh
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0
      - uses: actions/download-artifact@v6
        with:
          name: paacs-mesh-pypi-wheels
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: paacs-mesh-release-manifest
          path: release-proof
      - name: Recheck the exact files selected for publication
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: python scripts/prepare_python_release.py verify --manifest release-proof/release-manifest.json --dist dist --expected-sha "$EXPECTED_SHA"
      - name: Publish qualified wheels through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  verify-index:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          path: build/release-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: paacs-mesh-release-manifest
          path: release-proof
      - name: Verify index hashes and import, mesh and export after pip install
        run: python scripts/check_pypi_release.py --manifest release-proof/release-manifest.json --fixture build/release-source/tests/fixtures/cad/cylinder.step --output build/pypi-install
      - uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-index-install
          path: build/pypi-install/index-validation.json
          if-no-files-found: error
