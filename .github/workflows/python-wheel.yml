name: Python STEP wheel
on:
  pull_request:
    paths:
      - 'python/**'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'pyproject.toml'
      - 'scripts/build_python_wheel.py'
      - 'scripts/check_python_wheel.py'
      - 'scripts/check_python_parity.py'
      - 'scripts/prepare_python_release.py'
      - 'scripts/check_pypi_release.py'
      - 'scripts/check_python_release_run.py'
      - 'scripts/tests/**'
      - 'tests/fixtures/cad/*.step'
      - '.github/workflows/python-wheel.yml'
      - '.github/workflows/publish-python.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source commit selected by the release workflow
        required: false
        default: ''
        type: string
permissions:
  contents: read
env:
  # Verified registry manifest bytes and linux/amd64 config on 2026-11-21.
  PAACS_MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
jobs:
  release-assembly-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0
      - run: python -m unittest discover -s scripts/tests -p 'test_python_release*.py' -v

  windows-cp312:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install wheel build tools
        run: python -m pip install build==1.6.1 delvewheel==1.13.2 cmake==4.4.3 ninja==1.13.2
      - name: Build pinned OCCT, repair wheel and test installed STEP workflow
        run: python scripts/build_python_wheel.py --jobs 4
      - name: Save wheel, matching OCCT source and validation receipt
        uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-cp312-win_amd64
          path: dist/*
          if-no-files-found: error

  macos-cp312:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install wheel build tools
        run: python -m pip install build==1.6.1 delocate==0.13.0 cmake==4.4.3 ninja==1.13.2
      - name: Build pinned OCCT, repair ARM64 wheel and qualify installation
        run: python scripts/build_python_wheel.py --jobs 3
      - name: Save wheel, source and qualification receipts
        uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-cp312-macosx_15_0_arm64
          path: dist/*
          if-no-files-found: error

  linux-cp312:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Build and qualify inside the pinned manylinux 2.28 image
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            -e PAACS_MANYLINUX_IMAGE "$PAACS_MANYLINUX_IMAGE" bash -euc '
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              python -m pip install build==1.6.1 auditwheel==6.8.2 cmake==4.4.3 ninja==1.13.2
              python scripts/build_python_wheel.py --jobs 3
            '
      - name: Save wheel, source and qualification receipts
        uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-cp312-manylinux_2_28_x86_64
          path: dist/*
          if-no-files-found: error

  installed-cp312:
    needs: [windows-cp312, macos-cp312, linux-cp312]
    name: installed wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2022
            architecture: x64
            artifact: paacs-mesh-cp312-win_amd64
          - platform: macos-arm64
            os: macos-15
            architecture: arm64
            artifact: paacs-mesh-cp312-macosx_15_0_arm64
          - platform: linux-x86_64
            os: ubuntu-24.04
            architecture: x64
            artifact: paacs-mesh-cp312-manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/python-wheel-artifacts
      - name: Install and test on a fresh Windows or macOS runner
        if: runner.os != 'Linux'
        run: python scripts/check_python_wheel.py --artifact-dir build/python-wheel-artifacts
      - name: Install and test in a fresh manylinux 2.28 container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            "$PAACS_MANYLINUX_IMAGE" bash -euc '
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              python scripts/check_python_wheel.py --artifact-dir build/python-wheel-artifacts
            '
      - name: Save independent installation result
        uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-installed-${{ matrix.platform }}
          path: build/python-wheel-consumer/consumer-validation.json
          if-no-files-found: error
