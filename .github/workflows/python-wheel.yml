name: Python STEP wheel
on:
  pull_request:
    paths:
      - 'python/**'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'pyproject.toml'
      - 'scripts/build_python_wheel.py'
      - '.github/workflows/python-wheel.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cp312:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install wheel build tools
        run: python -m pip install build==1.6.1 delvewheel==1.13.2
      - name: Build pinned OCCT, repair wheel and test installed STEP workflow
        run: python scripts/build_python_wheel.py --jobs 4
      - name: Save wheel, matching OCCT source and validation receipt
        uses: actions/upload-artifact@v6
        with:
          name: paacs-mesh-cp312-win_amd64
          path: dist/*
          if-no-files-found: error
