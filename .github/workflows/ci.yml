name: mesh qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc16:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address-undefined, thread]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mesh-ci
          create-args: >-
            python=3.12 pip gxx_linux-64=16.2.0 libboost-headers=1.92.0
          cache-environment: true
      - name: Install build tools
        shell: micromamba-shell {0}
        run: python -m pip install cmake==4.4.3 ninja==1.13.2
      - name: Configure and build
        shell: micromamba-shell {0}
        env:
          PAACS_CI_SANITIZER: ${{ matrix.sanitizer }}
          PAACS_CI_UI_BRIDGE: ${{ matrix.sanitizer != 'none' && 'ON' || 'OFF' }}
          PAACS_CI_UNIT_TIMEOUT: ${{ matrix.sanitizer == 'none' && '1200' || '7200' }}
        run: |
          python3 scripts/verify_version.py
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPAACS_REQUIRE_GCC16=ON \
            -DPAACS_BUILD_UI_BRIDGE="$PAACS_CI_UI_BRIDGE" \
            -DPAACS_UNIT_TEST_TIMEOUT="$PAACS_CI_UNIT_TIMEOUT" \
            -DPAACS_WARNINGS_AS_ERRORS=ON -DPAACS_SANITIZER="$PAACS_CI_SANITIZER"
          cmake --build build/ci --parallel 2
      - name: Test
        shell: micromamba-shell {0}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci --output-on-failure
      - name: Installed consumers
        if: matrix.sanitizer == 'none'
        shell: micromamba-shell {0}
        run: |
          cmake --install build/ci --prefix "$PWD/out/install"
          for filename in LICENSE NOTICE LICENSING_STATUS.md CITATION.cff; do
            cmp "$filename" "out/install/share/doc/PAACSMesh/$filename"
          done
          cmake -S examples/consumer -B build/consumer -G Ninja \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure

  macos-core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build core and audit a Tet4 mesh
        run: |
          cmake -S . -B build/ci-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPAACS_CXX_STANDARD=23 \
            -DPAACS_BUILD_TESTS=OFF -DPAACS_WITH_OCCT=OFF -DPAACS_BUILD_UI_BRIDGE=OFF
          cmake --build build/ci-macos --target paacs-mesh --parallel 2
          build/ci-macos/paacs-mesh tet-box 0.45 build/ci-macos/box.paacsmesh --threads 1
          build/ci-macos/paacs-mesh audit build/ci-macos/box.paacsmesh

  native-step:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build pinned OCCT and the STEP tools
        shell: bash
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Ninja' }}
        run: |
          cmake -S cmake/step -B build/step -DPAACS_STEP_JOBS=3
          cmake --build build/step --config Release
          ctest --test-dir build/step -C Release --output-on-failure
      - name: Build and run native volume quality regressions
        shell: bash
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Ninja' }}
        run: |
          cmake -S tests/occt_quality -B build/step-quality \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAACS_NATIVE_BUILD="$PWD/build/step/paacs" \
            -DOpenCASCADE_DIR="$PWD/build/step/occt/lib/cmake/opencascade"
          cmake --build build/step-quality --config Release --parallel 3
          ctest --test-dir build/step-quality -C Release --output-on-failure
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows' || runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Check macOS STEP CLI options
        if: runner.os == 'macOS'
        run: python tests/native_cad_cli_checks.py build/step/bin/paacs-cad-mesh > build/step/cli-checks.json
      - name: Check Windows STEP options and tagged solver export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/verify_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD/build/step/occt/bin;$env:PATH"
          $mesher = 'build/step/bin/paacs-cad-mesh.exe'
          python tests/native_cad_cli_checks.py $mesher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/native_step_sizing.py save tests/fixtures/cad/cylinder.step build/ci-step-project `
            --size .7 --minimum .34 --growth 1.55 --face-tag 1 --face-size .38 `
            --box -.3 -.3 .7 .3 .3 1.3 .31
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/native_step_sizing.py mesh build/ci-step-project $mesher build/ci-step-result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content 'build/ci-step-result/measurements.json' -Raw | ConvertFrom-Json
          $tags = @($result.tags.PSObject.Properties.Name | Sort-Object)
          if (-not $result.solver_roundtrip -or ($tags -join ',') -ne '2:1,2:2,2:3,3:1') {
            throw 'STEP export did not preserve the cylinder face and body groups'
          }
